<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf6f2;--bg2:#f3ebe5;--card:#fffdfb;--ink:#4b3f3a;--mute:#a09089;--line:#eee4dd;--acc:#d6a6a4;--acc-d:#b9827f;--acc-s:#f7e7e4;--taupe:#b5a397;--brown:#8b6b5c;--sage:#b7c4a8;--r:18px;--sh:0 1px 2px rgba(110,80,60,.04),0 6px 24px rgba(110,80,60,.06);--font:'Inter',system-ui,-apple-system,sans-serif;--serif:'Playfair Display',Georgia,serif}
body.t-latte{--acc:#c9a27e;--acc-d:#a07a58;--acc-s:#f3e6d8}
body.t-mauve{--acc:#bfa2c0;--acc-d:#946f96;--acc-s:#f1e6f1}
body.t-sauge{--acc:#a9b89a;--acc-d:#7d8f6c;--acc-s:#e9efe2}
body.dark{--bg:#221d1b;--bg2:#2d2725;--card:#2a2422;--ink:#f1e7e1;--mute:#a8988f;--line:#3d3431;--acc-s:#3f3230;--taupe:#7d6e66;--brown:#d9bfae;--sh:0 6px 24px rgba(0,0,0,.25)}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s}
a{color:inherit}
#side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:2px;z-index:40;transition:transform .3s;overflow-y:auto}
.brand{font-family:var(--serif);font-size:22px;padding:4px 12px 18px;color:var(--brown)}
.brand i{color:var(--acc-d)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:500;transition:.2s}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a.on{background:var(--acc-s);color:var(--acc-d)}
.sfoot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:2px}
main{margin-left:236px;min-height:100vh}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.search{flex:1;max-width:460px;position:relative;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--mute)}
.search input{border:0;background:none;padding:10px 0;flex:1;box-shadow:none!important}
.spacer{flex:1}
#view{padding:8px 28px 110px;max-width:1300px}
#view.anim{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;min-width:0}
.card.soft{background:var(--bg2);box-shadow:none;border:0;padding:14px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.wgrid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.wide{grid-column:1/-1}
h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.2}
h2{font-size:15.5px;font-weight:600}
h3{font-size:14px;font-weight:600}
.serif{font-family:var(--serif);font-weight:500}
.sub{color:var(--mute);font-size:13px}
.upper{text-transform:uppercase;letter-spacing:.08em;font-size:11.5px}
.cap{text-transform:capitalize}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt{margin-top:14px}.mt4{margin-top:6px}
.click{cursor:pointer}
.center{text-align:center}
.lnk{color:var(--acc-d);font-size:13px;text-decoration:none;cursor:pointer;font-weight:500}
.btn{border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:500;cursor:pointer;background:var(--acc);color:#fff;display:inline-flex;align-items:center;gap:6px;transition:.2s;white-space:nowrap}
.btn:hover{background:var(--acc-d);transform:translateY(-1px)}
.btn.ghost{background:var(--bg2);color:var(--ink)}
.btn.ghost:hover{background:var(--acc-s)}
.btn.danger{background:#efd2ce;color:#8a3f3a}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.ib{border:0;background:none;color:var(--mute);width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib:hover{background:var(--bg2);color:var(--ink)}
.ib:disabled{opacity:.3;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 12px;width:100%;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
textarea{resize:vertical}
input[type=color]{padding:3px;height:40px;cursor:pointer}
label.f{display:block;font-size:12.5px;color:var(--mute);font-weight:500}
label.f>input,label.f>select,label.f>textarea,label.f>div,label.f>span{margin-top:5px}
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--taupe);border-radius:7px;cursor:pointer;display:inline-grid;place-items:center;flex:none;padding:0;background:var(--card)}
.chk:checked{background:var(--acc);border-color:var(--acc)}
.chk:checked::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bg2);color:var(--ink);white-space:nowrap}
.tag.late{background:#f3d6d2;color:#9a524b}
.tag.doing{background:#f0dbb8;color:#7a5a2c}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:13px;width:fit-content;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 13px;border-radius:10px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--mute);font-weight:500}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.over{background:var(--acc-s)}
.evbar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.empty{text-align:center;color:var(--mute);padding:22px 10px;font-size:13.5px}
.empty b{display:block;font-family:var(--serif);font-size:17px;color:var(--ink);font-weight:500;margin-bottom:3px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:12px 0 20px;flex-wrap:wrap}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:14px 0 22px;flex-wrap:wrap}
.hero h1{font-size:34px}
.acc{color:var(--acc-d)}
.hint{background:var(--acc-s);color:var(--acc-d);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px}
.big{font-family:var(--serif);font-size:26px;margin:4px 0;font-weight:500}
.big.neg{color:#b56b63}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.chip.on{background:var(--acc-s);border-color:var(--acc)}
.chip.offc{opacity:.4;text-decoration:line-through}
#modal{position:fixed;inset:0;background:rgba(60,40,30,.28);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .2s}
.mbox{background:var(--card);border-radius:22px;padding:24px;width:100%;max-width:580px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(60,40,30,.2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.hidden{display:none!important}

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5)}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function today(){return ymd(new Date())}
function parse(s){const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d||1)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function weekStart(s){const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)}
function addMonth(mo,n){const[y,m]=mo.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function monthLabel(mo){return parse(mo+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
function fmtLong(s){return parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtShort(s){if(!s)return'';const d=parse(s);const o={day:'numeric',month:'short'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('fr-FR',o)}
function fmtRel(s){const n=daysBetween(today(),s);return n===0?"Aujourd'hui":n===1?'Demain':n===-1?'Hier':fmtShort(s)}
function fmtH(min){min=Math.round(min||0);const h=Math.floor(min/60),m=min%60;return h?`${h}h${m?pad(m):''}`:`${m} min`}
function fmtClock(ms){const s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`}
function toMin(t){if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+(m||0)}
function toHM(m){m=Math.max(0,Math.min(1439,Math.round(m)));return `${pad(Math.floor(m/60))}:${pad(m%60)}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function eur(n){return (+n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}
function pct(a,b){return b>0?Math.min(100,a/b*100):0}
function r1(n){return Math.round((n||0)*10)/10}
function sumRange(m,a,b){let t=0;for(const k in m)if(k>=a&&k<=b)t+=m[k];return t}

// Fichiers (photos, PDF) → IndexedDB
const FS={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('mavie_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 tx(mode){return this.db.transaction('f',mode).objectStore('f')},
 put(id,blob){return new Promise((res,rej)=>{if(!this.db)return rej('no db');const r=this.tx('readwrite').put(blob,id);r.onsuccess=res;r.onerror=rej})},
 get(id){return new Promise(res=>{if(!this.db)return res(null);const r=this.tx('readonly').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})},
 del(id){if(this.db)this.tx('readwrite').delete(id)}
};
const URLS={};
async function fileURL(id){if(URLS[id])return URLS[id];const b=await FS.get(id);if(!b)return null;return URLS[id]=URL.createObjectURL(b)}
async function hydrate(){for(const img of $$('img[data-fid]')){if(img.getAttribute('src'))continue;const u=await fileURL(img.dataset.fid);if(u)img.src=u}}

function form(title,fields,vals={},onSave,extra=[]){
 let dls='';
 const fh=fields.map(f=>{const v=vals[f.k]??f.def??'';const id='f_'+f.k;let inp;
  if(f.type==='textarea')inp=`<textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else if(f.type==='select')inp=`<select id="${id}">${f.options.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.type==='check')inp=`<span class="row" style="color:var(--ink)"><input type="checkbox" class="chk" id="${id}" ${v?'checked':''}> ${esc(f.text||'')}</span>`;
  else if(f.type==='days'){const arr=Array.isArray(v)?v:[0,1,2,3,4,5,6];inp=`<div class="days" id="${id}">${[1,2,3,4,5,6,0].map(d=>`<label class="dchip"><input type="checkbox" value="${d}" ${arr.includes(d)?'checked':''}><span>${DOW[d]}</span></label>`).join('')}</div>`}
  else{if(f.opts)dls+=`<datalist id="dl_${f.k}">${f.opts.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;inp=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" ${f.step?`step="${f.step}"`:''} ${f.type==='number'?'inputmode="decimal"':''} placeholder="${esc(f.ph||'')}" ${f.opts?`list="dl_${f.k}"`:''}>`}
  return `<label class="f ${f.full||f.type==='textarea'||f.type==='days'?'full':''}" ${f.hide?'style="display:none"':''} id="w_${f.k}">${esc(f.label)}${inp}</label>`}).join('');
 modal(`${mhead(esc(title))}<form id="mform" class="fgrid">${fh}${dls}<button type="submit" hidden></button></form><div class="row between wrap" style="margin-top:20px;gap:8px"><div class="row wrap">${extra.map((b,i)=>`<button class="btn sm ${b.cls||'ghost'}" data-x="${i}">${b.label}</button>`).join('')}</div><div class="row"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="msave">Enregistrer</button></div></div>`);
 $$('[data-x]').forEach(b=>b.onclick=()=>extra[b.dataset.x].fn());
 const submit=()=>{const o={};for(const f of fields){const el=$('#f_'+f.k);if(!el)continue;
  if(f.type==='check')o[f.k]=el.checked;else if(f.type==='days')o[f.k]=$$('input:checked',el).map(i=>+i.value);else if(f.type==='number')o[f.k]=el.value===''?0:parseFloat(String(el.value).replace(',','.'));else o[f.k]=el.value.trim();
  if(f.req&&!o[f.k]){el.focus();el.style.borderColor='#d88';return}}
  closeModal();onSave(o)};
 $('#msave').onclick=submit;$('#mform').onsubmit=e=>{e.preventDefault();submit()};
 setTimeout(()=>{const fi=$('#mform input:not([type=checkbox]),#mform textarea');if(fi&&window.innerWidth>700)fi.focus()},60);
}

function barChart(data,o={}){const h=o.h||150,fmt=o.fmt||(v=>r1(v));
 const max=Math.max(...data.flatMap(d=>d.vs?d.vs.map(x=>x.v):[d.v]),o.goal||0)||1;
 return `<div class="bc" style="height:${h}px"><div class="bci">${o.goal?`<div class="goal" style="bottom:${o.goal/max*100}%" title="Objectif"></div>`:''}${data.map(d=>{const vs=d.vs||[{v:d.v,c:d.c}];return `<div class="bcol" title="${esc(d.t||d.l)} : ${vs.map(x=>fmt(x.v)).join(' / ')}"><div class="bvs">${vs.map(x=>`<div class="bv" style="height:${x.v>0?Math.max(x.v/max*100,2):0}%;background:${x.c||'var(--acc)'}"></div>`).join('')}</div><span>${esc(d.l)}</span></div>`}).join('')}</div></div>`}
function donut(data,size=150,center=''){const tot=data.reduce((a,d)=>a+d.v,0);const r=size/2-12,C=2*Math.PI*r;let off=0;const c=size/2;
 const segs=tot?data.filter(d=>d.v>0).map(d=>{const len=d.v/tot*C;const s=`<circle r="${r}" cx="${c}" cy="${c}" fill="none" stroke="${d.c}" stroke-width="15" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"><title>${esc(d.l)}</title></circle>`;off+=len;return s}).join(''):'';
 return `<div class="donut" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle r="${r}" cx="${c}" cy="${c}" fill="none" stroke="var(--bg2)" stroke-width="15"/>${segs}</svg><div class="dc"><div>${center}</div></div></div>`}
function ring(p,size=100,label='',sub='',color='var(--acc)'){const r=size/2-7,C=2*Math.PI*r,pp=Math.max(0,Math.min(p||0,1));
 return `<div class="donut" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="var(--bg2)" stroke-width="7"/><circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*pp} ${C}" style="transition:stroke-dasharray .6s"/></svg><div class="dc"><div><b>${label}</b><small>${sub}</small></div></div></div>`}
function legend(data,fmt=v=>v){return `<div class="legend">${data.map(d=>`<div class="row"><span class="dot" style="background:${d.c}"></span><span class="grow">${esc(d.l)}</span><b>${fmt(d.v)}</b></div>`).join('')}</div>`}

function occ(ev,ds){if(ds<ev.date)return false;if(ev.until&&ds>ev.until)return false;const r=ev.rec||'none';if(r==='none')return ds===ev.date;if(r==='daily')return true;const a=parse(ev.date),b=parse(ds);if(r==='weekdays'){const w=b.getDay();return w>0&&w<6}if(r==='weekly')return a.getDay()===b.getDay();if(r==='biweekly')return a.getDay()===b.getDay()&&daysBetween(ev.date,ds)%14===0;if(r==='monthly')return a.getDate()===b.getDate();return false}
function eventsOn(ds){return S.events.filter(e=>occ(e,ds)&&!(e.ex||[]).includes(ds)).sort((a,b)=>(a.start||'').localeCompare(b.start||''))}
function isTaskList(id){const l=S.lists.find(x=>x.id===id);return !l||l.type!=='shopping'}
function listName(id){const l=S.lists.find(x=>x.id===id);return l?l.name:'—'}
const PRIO={3:['Haute','#e3aaa5'],2:['Moyenne','#ecd0a8'],1:['Basse','#c9d6bf']};
function taskSort(a,b){return (a.status==='done')-(b.status==='done')||(a.due||'9999').localeCompare(b.due||'9999')||(+b.prio||2)-(+a.prio||2)}
function prioTasks(){const lim=addDays(today(),1);return S.tasks.filter(t=>isTaskList(t.list)&&t.status!=='done'&&(+t.prio===3||(t.due&&t.due<=lim))).sort(taskSort)}
function monthTx(mo){return S.tx.filter(t=>t.date&&t.date.startsWith(mo))}
function sums(list){let i=0,o=0,s=0,fx=0;list.forEach(t=>{const a=+t.amount||0;if(t.type==='in')i+=a;else if(t.type==='out'){o+=a;if(t.fixed)fx+=a}else if(t.type==='save')s+=t.cat==='Retrait épargne'?-a:a});return{i,o,s,fx,bal:i-o-s}}
function byCat(list){const m={};list.filter(t=>t.type==='out').forEach(t=>m[t.cat]=(m[t.cat]||0)+(+t.amount||0));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bCol(cat){const i=S.txCats.out.indexOf(cat);if(i>=0)return PAL[i%PAL.length];let h=0;for(const c of cat||'')h+=c.charCodeAt(0);return PAL[h%PAL.length]}

function openEvent(id,ds){const ev=S.events.find(e=>e.id===id);if(!ev)return;if(ev.fromItem&&!ev.rec){}const rec=ev.rec&&ev.rec!=='none';
 const ex=[{label:ic('copy',14)+' Dupliquer',fn:()=>{const c={...ev};delete c.id;newEvent({...c,date:ds||ev.date,rec:'none',until:''})}}];
 if(rec)ex.push({label:'Suppr. ce jour',cls:'danger',fn:()=>{ev.ex=[...(ev.ex||[]),ds];save();closeModal();render();toast('Occurrence supprimée')}});
 ex.push({label:ic('trash',14)+(rec?' Toute la série':' Supprimer'),cls:'danger',fn:()=>ask(rec?'Supprimer toute la série ?':'Supprimer cet événement ?',()=>{S.events=S.events.filter(e=>e.id!==id);save();render()})});
 form(rec?'Modifier (toute la série)':'Modifier l\'événement',evFields(),ev,o=>{Object.assign(ev,o);save();render();toast('Modifié')},ex);linkCatColor()}
let DRAG=null;

function moveOcc(ev,fromDs,toDs,start,end){if(ev.rec&&ev.rec!=='none'){ev.ex=[...(ev.ex||[]),fromDs];const n={...ev,id:uid(),rec:'none',until:'',ex:[],date:toDs};if(start!=null){n.start=start;n.end=end}S.events.push(n)}else{ev.date=toDs;if(start!=null){ev.start=start;ev.end=end}}}
function dropDay(e,ds,el){e.preventDefault();el.classList.remove('over');if(!DRAG)return;const ev=S.events.find(x=>x.id===DRAG.id);if(ev&&DRAG.ds!==ds){moveOcc(ev,DRAG.ds,ds);save();render();toast('Événement déplacé')}DRAG=null}
function dropTime(e,col){e.preventDefault();if(!DRAG)return;const ev=S.events.find(x=>x.id===DRAG.id);if(!ev)return;const r=col.getBoundingClientRect();const min=H0*60+Math.round((e.clientY-r.top)/HH*4)*15;const dur=ev.start&&ev.end?toMin(ev.end)-toMin(ev.start):60;moveOcc(ev,DRAG.ds,col.dataset.ds,toHM(min),toHM(min+Math.max(dur,15)));DRAG=null;save();render();toast('Horaire modifié')}
function slotClick(e,col){if(e.target!==col)return;const r=col.getBoundingClientRect();const min=H0*60+Math.floor((e.clientY-r.top)/HH*2)*30;newEvent({date:col.dataset.ds,start:toHM(min),end:toHM(min+60)})}
function calNav(n){const c=UI.cal;if(c.view==='month')c.date=addMonth(c.date.slice(0,7),n)+'-01';else c.date=addDays(c.date,n*(c.view==='week'?7:c.view==='list'?30:1));render()}
function chip(e,ds){return `<div class="ev" draggable="true" ondragstart="dragEv(event,'${e.id}','${ds}')" onclick="event.stopPropagation();openEvent('${e.id}','${ds}')" style="background:${evColor(e)}" title="${esc(e.title)}">${e.start?`<b>${e.start}</b> `:''}${esc(e.title)}</div>`}
function layout(evs){const m=new Map(),ends=[];evs.forEach(e=>{const s=toMin(e.start),en=e.end?toMin(e.end):s+60;let i=ends.findIndex(x=>x<=s);if(i<0){i=ends.length;ends.push(en)}else ends[i]=en;m.set(e,{i})});const n=ends.length||1;m.forEach(v=>v.n=n);return m}
function nowLine(){const n=new Date(),min=n.getHours()*60+n.getMinutes();return min<H0*60?'':`<div class="now" style="top:${(min-H0*60)/60*HH}px"></div>`}
function weekGrid(days){const n=days.length,td=today();
 const head=`<div class="wkh" style="--n:${n}"><div></div>${days.map(ds=>{const d=parse(ds);const ad=visible(ds).filter(e=>!e.start);return `<div class="wkd ${ds===td?'tod':''}" ondragover="event.preventDefault()" ondrop="dropDay(event,'${ds}',this)"><span class="click" onclick="UI.cal.date='${ds}';UI.cal.view='day';render()"><small class="sub">${DOW[d.getDay()]}</small> <b>${d.getDate()}</b></span>${ad.map(e=>chip(e,ds)).join('')}</div>`}).join('')}</div>`;
 let hrs='';for(let h=H0;h<H1;h++)hrs+=`<div style="height:${HH}px">${h===H0?'':pad(h)+':00'}</div>`;
 const cols=days.map(ds=>{const evs=visible(ds).filter(e=>e.start);const L=layout(evs);return `<div class="dcol ${ds===td?'tod':''}" data-ds="${ds}" style="height:${(H1-H0)*HH}px" ondragover="event.preventDefault()" ondrop="dropTime(event,this)" onclick="slotClick(event,this)">${evs.map(e=>{const s=Math.max(toMin(e.start),H0*60),en=Math.max(e.end?toMin(e.end):s+60,s+20),l=L.get(e);return `<div class="evb" draggable="true" ondragstart="dragEv(event,'${e.id}','${ds}')" onclick="event.stopPropagation();openEvent('${e.id}','${ds}')" style="top:${(s-H0*60)/60*HH}px;height:${(en-s)/60*HH-2}px;left:${l.i/l.n*100}%;width:calc(${100/l.n}% - 3px);background:${evColor(e)}"><b>${esc(e.title)}</b><small>${e.start}${e.end?'–'+e.end:''}${e.loc?' · '+esc(e.loc):''}</small></div>`}).join('')}${ds===td?nowLine():''}</div>`}).join('');
 return `<div class="wkb"><div class="wkin" style="--mw:${n>1?'680px':'0'}">${head}<div class="wkg" style="--n:${n}"><div class="hrs">${hrs}</div>${cols}</div></div></div><p class="sub mt4">Clique sur un créneau pour créer un événement · glisse un événement pour le déplacer.</p>`}
function monthGrid(){const c=UI.cal,mo=c.date.slice(0,7),first=mo+'-01',gs=weekStart(first);const dim=new Date(+mo.slice(0,4),+mo.slice(5),0).getDate();const off=daysBetween(gs,first);const cells=Math.ceil((off+dim)/7)*7;const td=today();

 return `<div class="mgrid">${h}</div>`}

 h+=`<div class="lday"><div class="ldate"><b>${d.getDate()}</b><small>${DOW[d.getDay()]} ${MON[d.getMonth()]}</small>${ds===td?'<div class="tag" style="margin-top:4px">auj.</div>':''}</div><div class="grow">${evs.map(e=>`<div class="item click" onclick="openEvent('${e.id}','${ds}')"><span class="evbar" style="background:${evColor(e)}"></span><div class="grow"><b style="font-weight:500">${esc(e.title)}</b><div class="sub">${e.start?e.start+(e.end?' – '+e.end:''):'Journée'} · ${esc(e.cat)}${e.loc?' · '+esc(e.loc):''}${e.remind>=0&&e.remind!==''&&e.remind!=='-1'?' · 🔔':''}</div>${e.desc?`<div class="sub">${esc(e.desc)}</div>`:''}</div>${e.rec&&e.rec!=='none'?'<span class="tag">↻</span>':''}</div>`).join('')}</div></div>`}
 return h||empty('Rien de prévu','Aucun événement dans les 60 jours à partir de cette date.')}

function hDone(h,ds){return !!(h.log&&h.log[ds])}
function hSched(h,ds){if(h.freq==='weekly')return true;return (h.days&&h.days.length?h.days:[0,1,2,3,4,5,6]).includes(parse(ds).getDay())}
function hStart(h){const f=Object.keys(h.log||{}).sort()[0];return [h.created||today(),f||today()].sort()[0]}
function togHabit(id,ds){const h=S.habits.find(x=>x.id===id);if(!h)return;h.log=h.log||{};if(h.log[ds])delete h.log[ds];else h.log[ds]=1;save();render()}
function weekCount(h,ws){let c=0;for(let i=0;i<7;i++)if(hDone(h,addDays(ws,i)))c++;return c}
function hStreak(h){const td=today(),st=hStart(h);if(h.freq==='weekly'){const t=h.target||1;let s=0,w=weekStart(td);if(weekCount(h,w)<t)w=addDays(w,-7);while(w>=weekStart(st)&&weekCount(h,w)>=t){s++;w=addDays(w,-7)}return s}
 let s=0,d=td;while(d>=st){if(hSched(h,d)){if(hDone(h,d))s++;else if(d!==td)break}d=addDays(d,-1)}return s}
function hBest(h){const td=today(),st=hStart(h);let best=0,cur=0;if(h.freq==='weekly'){const t=h.target||1;for(let w=weekStart(st);w<=td;w=addDays(w,7)){if(weekCount(h,w)>=t){cur++;best=Math.max(best,cur)}else if(w!==weekStart(td))cur=0}return best}
 for(let d=st;d<=td;d=addDays(d,1)){if(!hSched(h,d))continue;if(hDone(h,d)){cur++;best=Math.max(best,cur)}else if(d!==td)cur=0}return best}
function hRate(h,n=30){const td=today(),st=hStart(h);if(h.freq==='weekly'){let c=0,days=0;for(let i=0;i<28;i++){const d=addDays(td,-i);if(d<st)break;days++;if(hDone(h,d))c++}const weeks=Math.max(1,days/7);return Math.min(1,c/((h.target||1)*weeks))}
 let s=0,d=0;for(let i=0;i<n;i++){const ds=addDays(td,-i);if(ds<st)break;if(hSched(h,ds)){if(ds===td&&!hDone(h,ds))continue;s++;if(hDone(h,ds))d++}}return s?d/s:0}
function daysLabel(h){const d=h.days&&h.days.length?h.days:[0,1,2,3,4,5,6];return d.length===7?'Tous les jours':[1,2,3,4,5,6,0].filter(x=>d.includes(x)).map(x=>DOW[x]).join(' · ')}
